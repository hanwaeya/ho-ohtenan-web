<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>GIS ISP PRO SURVEY MODE</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<style>

body{
    margin:0;
    font-family:Arial;
    display:grid;
    grid-template-columns: 1fr 1fr;
    height:100vh;
}

#map{
    height:100vh;
    width:100%;
}

.panel{
    padding:15px;
    overflow:auto;
    background:#0f172a;
    color:white;
}

input,select{
    width:100%;
    padding:10px;
    margin:5px 0;
    border-radius:8px;
    border:none;
}

button{
    width:100%;
    padding:10px;
    margin-top:5px;
    border:none;
    border-radius:8px;
    font-weight:bold;
    cursor:pointer;
}

.btn1{background:#2563eb;color:white;}
.btn2{background:#16a34a;color:white;}
.btn3{background:#eab308;color:black;}
.btn4{background:#dc2626;color:white;}

table{
    width:100%;
    font-size:12px;
    border-collapse:collapse;
    margin-top:10px;
}

td,th{
    padding:6px;
    border-bottom:1px solid #374151;
}

.badge{
    padding:4px 8px;
    border-radius:999px;
    font-size:10px;
}

.green{background:#16a34a;}
.yellow{background:#eab308;color:black;}
.red{background:#dc2626;}

#infoBox{
    position:fixed;
    bottom:15px;
    left:15px;
    background:#111827;
    color:white;
    padding:10px;
    border-radius:10px;
    font-size:12px;
    z-index:9999;
}

</style>
</head>

<body>

<div id="map"></div>

<div class="panel">

<h2>📡 ISP SURVEY PRO</h2>

<input id="nama" placeholder="Nama">
<input id="hp" placeholder="HP">
<input id="alamat" placeholder="Alamat">

<select id="status">
<option>AKTIF</option>
<option>GANGGUAN</option>
<option>ISOLIR</option>
</select>

<input id="lat" placeholder="Latitude">
<input id="lng" placeholder="Longitude">

<button class="btn1" onclick="gps()">📍 GPS</button>
<button class="btn2" onclick="saveData()">➕ Simpan</button>
<button class="btn3" onclick="backup()">💾 Backup</button>
<button class="btn4" onclick="resetAll()">🗑 Reset</button>

<h3>🔎 Search</h3>
<input id="search" onkeyup="renderList()">

<h3>📋 Data</h3>
<table>
<tbody id="list"></tbody>
</table>

</div>

<div id="infoBox">📍 Siap Survey</div>

<script>

/* DATABASE */
let data =
JSON.parse(localStorage.getItem("isp_survey")) || [];

/* MAP */
let map = L.map('map').setView([-6.2,106.8], 10);

L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{
    attribution:'© OSM'
}).addTo(map);

let marker = null;

/* INFO */
function info(msg){
    document.getElementById("infoBox").innerText = "📍 " + msg;
}

/* INIT MAP CLICK */
map.on("click", e=>{
    setPoint(e.latlng.lat,e.latlng.lng,"manual");
});

/* SET POINT */
function setPoint(lat,lng,type){

    document.getElementById("lat").value = lat.toFixed(6);
    document.getElementById("lng").value = lng.toFixed(6);

    if(marker){
        map.removeLayer(marker);
    }

    marker = L.marker([lat,lng],{
        draggable:true
    }).addTo(map);

    marker.on("dragend", ()=>{
        let p = marker.getLatLng();
        document.getElementById("lat").value = p.lat.toFixed(6);
        document.getElementById("lng").value = p.lng.toFixed(6);
        info("drag marker ✔");
    });

    map.setView([lat,lng],18);

    info(type === "gps" ? "GPS lokasi" : "manual map ✔");
}

/* GPS */
function gps(){

    navigator.geolocation.getCurrentPosition(pos=>{

        setPoint(pos.coords.latitude,pos.coords.longitude,"gps");

    },()=>{

        alert("GPS tidak akurat, gunakan klik map");

    },{
        enableHighAccuracy:true,
        timeout:10000
    });

}

/* SAVE */
function saveData(){

    data.push({
        nama:document.getElementById("nama").value,
        hp:document.getElementById("hp").value,
        alamat:document.getElementById("alamat").value,
        status:document.getElementById("status").value,
        lat:document.getElementById("lat").value,
        lng:document.getElementById("lng").value
    });

    localStorage.setItem("isp_survey",JSON.stringify(data));

    renderMap();
    renderList();

    info("data tersimpan ✔");

}

/* RENDER MAP */
function renderMap(){

    data.forEach(p=>{

        if(p.lat && p.lng){

            L.marker([p.lat,p.lng])
            .addTo(map)
            .bindPopup(`
                <b>${p.nama}</b><br>
                ${p.alamat}<br>
                ${p.status}<br><br>
                <a target="_blank"
                href="https://www.google.com/maps?q=${p.lat},${p.lng}">
                🚗 Navigasi
                </a>
            `);

        }

    });

}

/* LIST */
function renderList(){

    let q = document.getElementById("search").value.toLowerCase();

    let html = "";

    data.forEach((p,i)=>{

        if(p.nama.toLowerCase().includes(q)){

            html += `
            <tr>
                <td>${p.nama}</td>
                <td>
                    <span class="badge ${
                        p.status==="AKTIF"?"green":
                        p.status==="GANGGUAN"?"yellow":"red"
                    }">${p.status}</span>
                </td>
            </tr>
            `;

        }

    });

    document.getElementById("list").innerHTML = html;

}

/* BACKUP */
function backup(){

    let blob = new Blob(
        [JSON.stringify(data,null,2)],
        {type:"application/json"}
    );

    let a = document.createElement("a");

    a.href = URL.createObjectURL(blob);
    a.download = "isp-survey-backup.json";
    a.click();

}

/* RESET */
function resetAll(){

    if(confirm("Hapus semua data?")){

        data = [];
        localStorage.removeItem("isp_survey");

        renderMap();
        renderList();

    }

}

/* INIT */
renderMap();
renderList();

</script>

</body>
</html>
