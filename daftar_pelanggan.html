<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ISP PRO GIS NEXT LEVEL</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">

<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<style>

body{
    margin:0;
    font-family:Inter;
    background:#0f172a;
    color:white;
}

.container{
    display:grid;
    grid-template-columns: 1fr 1.2fr;
    height:100vh;
}

/* SIDEBAR */

.sidebar{
    background:#111827;
    padding:15px;
    overflow:auto;
}

.card{
    background:#1f2937;
    padding:15px;
    border-radius:12px;
    margin-bottom:12px;
}

input,select{
    width:100%;
    padding:10px;
    margin-top:5px;
    border-radius:10px;
    border:none;
    outline:none;
}

button{
    width:100%;
    padding:10px;
    margin-top:8px;
    border:none;
    border-radius:10px;
    cursor:pointer;
    font-weight:700;
}

.btn-blue{background:#2563eb;color:white;}
.btn-green{background:#16a34a;color:white;}
.btn-red{background:#dc2626;color:white;}
.btn-yellow{background:#eab308;color:black;}

table{
    width:100%;
    font-size:12px;
    border-collapse:collapse;
}

td{
    padding:6px;
    border-bottom:1px solid #374151;
}

/* MAP */

#map{
    height:100vh;
    width:100%;
}

/* BADGE */

.badge{
    padding:4px 8px;
    border-radius:999px;
    font-size:10px;
    font-weight:700;
}

.green{background:#16a34a;}
.yellow{background:#eab308;color:black;}
.red{background:#dc2626;}

</style>
</head>

<body>

<div class="container">

<!-- SIDEBAR -->
<div class="sidebar">

<h2>📡 ISP PRO GIS</h2>

<div class="card">

<h3>➕ Tambah Pelanggan</h3>

<input id="nama" placeholder="Nama">
<input id="hp" placeholder="HP">
<input id="alamat" placeholder="Alamat">

<select id="status">
<option>AKTIF</option>
<option>GANGGUAN</option>
<option>ISOLIR</option>
</select>

<input id="lat" placeholder="Latitude">
<input id="lng" placeholder="Longitude">

<button class="btn-blue" onclick="gps()">📍 Ambil GPS</button>
<button class="btn-green" onclick="add()">➕ Simpan</button>

</div>

<div class="card">

<h3>📊 Statistik</h3>

<p id="stat"></p>

</div>

<div class="card">

<h3>🔎 Search</h3>
<input id="search" onkeyup="render()">

</div>

<div class="card">

<h3>📋 List</h3>
<table>
<tbody id="list"></tbody>
</table>

</div>

<div class="card">

<button class="btn-yellow" onclick="backup()">💾 Backup</button>
<button class="btn-red" onclick="resetAll()">🗑 Reset</button>

</div>

</div>

<!-- MAP -->
<div id="map"></div>

</div>

<script>

/* DB */
let data =
JSON.parse(localStorage.getItem("isp_pro")) || [];

/* MAP */
let map = L.map('map').setView([-6.2,106.8],10);

L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{
    attribution:'© OSM'
}).addTo(map);

/* ICON */

function icon(status){

    let c = "#16a34a";

    if(status==="GANGGUAN") c="#eab308";
    if(status==="ISOLIR") c="#dc2626";

    return L.divIcon({
        className:"",
        html:`<div style="
            width:12px;
            height:12px;
            border-radius:50%;
            background:${c};
            border:2px solid white;
        "></div>`
    });

}

/* RENDER MAP */

function renderMap(){

    map.eachLayer(layer=>{
        if(layer instanceof L.Marker) map.removeLayer(layer);
    });

    data.forEach(p=>{

        if(p.lat && p.lng){

            L.marker([p.lat,p.lng],{
                icon:icon(p.status)
            })

            .addTo(map)

            .bindPopup(`

                <b>${p.nama}</b><br>
                ${p.alamat}<br>
                <b>${p.status}</b><br><br>

                <a target="_blank"
                href="https://www.google.com/maps?q=${p.lat},${p.lng}">
                🚗 Navigasi
                </a>

            `);

        }

    });

}

/* GPS */

function gps(){

    navigator.geolocation.getCurrentPosition(pos=>{

        document.getElementById("lat").value = pos.coords.latitude;
        document.getElementById("lng").value = pos.coords.longitude;

        map.setView([pos.coords.latitude,pos.coords.longitude],16);

    });

}

/* ADD */

function add(){

    data.push({

        nama:document.getElementById("nama").value,
        hp:document.getElementById("hp").value,
        alamat:document.getElementById("alamat").value,
        status:document.getElementById("status").value,
        lat:document.getElementById("lat").value,
        lng:document.getElementById("lng").value

    });

    save();
    render();
    renderMap();
    stat();

}

/* RENDER LIST */

function render(){

    let q = document.getElementById("search").value || "";

    let html = "";

    data.forEach((p,i)=>{

        if(p.nama.toLowerCase().includes(q.toLowerCase())){

            html += `
            <tr>
                <td>${p.nama}</td>
                <td>
                    <span class="badge ${
                        p.status==="AKTIF"?"green":
                        p.status==="GANGGUAN"?"yellow":"red"
                    }">
                        ${p.status}
                    </span>
                </td>
            </tr>
            `;

        }

    });

    document.getElementById("list").innerHTML = html;

}

/* STAT */

function stat(){

    let a = data.filter(x=>x.status==="AKTIF").length;
    let g = data.filter(x=>x.status==="GANGGUAN").length;
    let i = data.filter(x=>x.status==="ISOLIR").length;

    document.getElementById("stat").innerHTML = `
    Total: ${data.length}<br>
    Aktif: ${a}<br>
    Gangguan: ${g}<br>
    Isolir: ${i}
    `;

}

/* SAVE */

function save(){
    localStorage.setItem("isp_pro",JSON.stringify(data));
}

/* BACKUP */

function backup(){

    let blob = new Blob(
        [JSON.stringify(data,null,2)],
        {type:"application/json"}
    );

    let a = document.createElement("a");

    a.href = URL.createObjectURL(blob);
    a.download = "isp-pro-backup.json";
    a.click();

}

/* RESET */

function resetAll(){

    if(confirm("Hapus semua data?")){

        data = [];
        save();
        render();
        renderMap();
        stat();

    }

}

/* INIT */

render();
renderMap();
stat();

</script>

</body>
</html>
